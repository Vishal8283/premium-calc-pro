<div class="hero">
    <div class="hero-blob blob-1" aria-hidden="true"></div>
    <div class="hero-blob blob-2" aria-hidden="true"></div>
    <div class="hero-content">
        <span class="badge">⚡ Instant Quotes</span>
        <h1>Get Your <span class="highlight">Insurance Quote</span> in Minutes</h1>
        <p class="hero-subtitle">
            Compare Basic, Standard, and Premium plans instantly — no paperwork, no waiting.
        </p>
    </div>
</div>

<div class="type-selector">
    <div class="section-heading">
        <h2 id="insurance-type-heading">What would you like to insure?</h2>
        <p class="subtitle">Choose a category to get started</p>
    </div>

    <div class="options-grid" role="group" aria-labelledby="insurance-type-heading">
        @for (option of options; track option.type) {
        <button class="option-card" [class]="option.accentClass" type="button"
            [attr.aria-label]="option.label + ': ' + option.description" (click)="selectType(option.type)">
            <div class="icon-wrap" aria-hidden="true">
                <span class="icon">{{ option.icon }}</span>
            </div>
            <h3>{{ option.label }}</h3>
            <p>{{ option.description }}</p>
            <span class="cta">Get Quote <span class="arrow" aria-hidden="true">→</span></span>
        </button>
        }
    </div>

    <div class="trust-strip" role="list" aria-label="Key benefits">
        <div class="trust-item" role="listitem">
            <span class="trust-icon" aria-hidden="true">📊</span>
            <div>
                <strong>3</strong>
                <span>Plan
